syntax = "proto3";

package tieba;

import "AppPosInfo.proto";
import "Agree.proto";
import "CommonRequest.proto";
import "Error.proto";
import "ThreadInfo.proto";

message PersonalizedRequestData {
  CommonRequest common = 1;
  uint32 tag_code = 2;
  uint32 need_tags = 3;
  uint32 load_type = 4;
  uint32 page_thread_count = 5;
  uint32 pn = 6;
  uint32 sug_count = 7;
  int32 scr_w = 8;
  int32 scr_h = 9;
  double scr_dip = 10;
  int32 q_type = 11;
  uint32 need_forumlist = 22;
  uint32 new_net_type = 23;
  int32 pre_ad_thread_count = 26;
  int32 new_install = 27;
  int32 request_times = 28;
  string invoke_source = 29;
  AppPosInfo app_pos = 36;
  int32 is_newfeed = 40;
  int32 cache_column_style = 46;
}

message PersonalizedRequest {
  PersonalizedRequestData data = 1;
}

message PersonalizedFeedKV { string key = 1; string value = 2; }
message PersonalizedFeedText { string text = 1; }
message PersonalizedFeedResource { int32 type = 1; PersonalizedFeedText text_info = 8; }
message PersonalizedPostExposeHead { string img_url = 1; }
message PersonalizedPostExpose {
  string schema = 1;
  string stamp_url = 2;
  repeated PersonalizedFeedResource floor = 3;
  PersonalizedPostExposeHead head_img = 4;
  repeated PersonalizedFeedKV business_info = 5;
  string head_text = 6;
  Agree head_agree = 7;
}
message PersonalizedComponent { PersonalizedPostExpose feed_postexpose = 20; }
message PersonalizedFeedLayout {
  repeated PersonalizedComponent components = 1;
  repeated PersonalizedFeedKV business_info = 5;
  repeated PersonalizedComponent components_new_style = 11;
}
message PersonalizedLayoutFactory { PersonalizedFeedLayout feed = 2; }
message PersonalizedPageData { repeated PersonalizedLayoutFactory feed_list = 1; }
message PersonalizedResponseData {
  repeated ThreadInfo thread_list = 2;
  PersonalizedPageData page_data = 27;
}

message PersonalizedResponse {
  Error error = 1;
  PersonalizedResponseData data = 2;
}
